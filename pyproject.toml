
[project]
name = "medscan-assist"
version = "1.0.0"
requires-python = ">=3.12,<3.13"

dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "efficientnet-pytorch>=0.7.1",
    "Pillow>=10.0.0",
    "opencv-python-headless>=4.8.0",
    "numpy>=1.24.0",
    "flask>=3.0.0",
    "flask-cors>=4.0.0",
    "jinja2>=3.1.0",
    "weasyprint>=60.0; sys_platform != 'win32'",
    "python-dotenv>=1.0.0",
    "werkzeug>=3.0.0",
    "grad-cam>=1.4.0"
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
